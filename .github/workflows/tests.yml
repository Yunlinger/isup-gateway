name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . ruff
      - run: ruff check isup_gateway tests
      - run: ruff format --check isup_gateway tests
      - run: python -m unittest discover -s tests -v
      - run: python -m isup_gateway --config examples/gateway.three.json --check
