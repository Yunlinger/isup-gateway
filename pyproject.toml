[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isup-preview-gateway"
version = "0.1.0"
description = "Configurable ISUP 5 live-preview gateway and virtual camera"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=43,<51"]

[project.scripts]
isup-gateway = "isup_gateway.live_gateway:main"
isup-virtual-camera = "isup_gateway.virtual_camera:main"

[tool.setuptools]
packages = ["isup_gateway"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
